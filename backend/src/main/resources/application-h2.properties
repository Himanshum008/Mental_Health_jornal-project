server.port=8080
spring.application.name=mental-health-journal-backend

# H2 In-Memory / File Database
spring.datasource.url=jdbc:h2:file:./data/mentalhealth;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

jwt.secret=${JWT_SECRET:MentalHealthJournalSuperSecretKeyMustBeAtLeast256BitsLongForHMACSHA256AlgorithmSecurityCheck}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
