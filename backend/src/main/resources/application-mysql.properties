# MySQL Production Configuration Profile
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Or: java -jar target/mental-health-journal-backend-1.0.0.jar --spring.profiles.active=mysql

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mental_health_journal?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
