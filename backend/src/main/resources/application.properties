# Server Configuration
server.port=8080
spring.application.name=mental-health-journal-backend

# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mental_health_journal?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Himanshu2006@}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# File Upload Settings
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JWT Security Configuration
jwt.secret=${JWT_SECRET:MentalHealthJournalSuperSecretKeyMustBeAtLeast256BitsLongForHMACSHA256AlgorithmSecurityCheck}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Python ML Microservice Connection
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}

# Logging
logging.level.com.mentalhealth=INFO
logging.level.org.springframework.security=WARN
